services:
  postgres:
    image: postgres:16
    container_name: consignment-pg
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: consignment_erp
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d consignment_erp"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consignment-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://erp:erp@postgres:5432/consignment_erp?schema=public
      JWT_SECRET: "${JWT_SECRET:-dev-only-secret-please-change-me-0123456789abcdef}"
      JWT_EXPIRES_IN: 12h
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_COST: "12"
      DEFAULT_TIMEZONE: Asia/Bangkok
      LOG_LEVEL: info
      PAGINATION_DEFAULT_PAGE_SIZE: "50"
      PAGINATION_MAX_PAGE_SIZE: "200"
      RUN_MIGRATIONS: "true"
      RUN_SEED: "${RUN_SEED:-true}"
    ports:
      - "3000:3000"

  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: consignment-web
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
    ports:
      - "3001:3000"

volumes:
  pg_data:
