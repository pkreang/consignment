name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + typecheck + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: consignment_erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d consignment_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/consignment_erp_test?schema=public
      DIRECT_URL: postgresql://erp:erp@localhost:5432/consignment_erp_test?schema=public
      TEST_DATABASE_URL: postgresql://erp:erp@localhost:5432/consignment_erp_test?schema=public
      JWT_SECRET: ci-only-secret-please-rotate-0123456789abcdef
      BCRYPT_COST: "4"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema src/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema src/prisma/schema.prisma
      - run: npm run lint --if-present
      - run: npx tsc --noEmit
      - run: npm test -- --run --reporter=basic
      - name: OpenAPI export (sanity)
        run: npm run openapi:export

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:i18n
      - run: npx tsc --noEmit
      - run: NEXT_TELEMETRY_DISABLED=1 npx next build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: consignment-erp-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: consignment-erp-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
