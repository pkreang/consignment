name: OCI A1.Flex Retry

# Polls Oracle Cloud trying to provision a VM.Standard.A1.Flex Always Free
# instance. Disables itself on success or on any non-capacity error.
#
# GitHub Actions free quota (private repo): 2,000 min/month.
# Each run usually finishes in 30-90s (rounded up to 1 min).
# Current cron = */15 = ~2,880 runs/month -> may exceed quota on private repo.
# Adjust to */30 if you hit billing limits, or make the repo public for unlimited.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      ocpus:
        description: 'OCPUs (default 4)'
        required: false
        default: '4'
      memory_gb:
        description: 'Memory GB (default 24)'
        required: false
        default: '24'

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-a1-retry
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_FILE: /home/runner/.oci/oci_api_key.pem
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
      DISPLAY_NAME: consignment-api
      OCPUS: ${{ github.event.inputs.ocpus || '4' }}
      MEM_GB: ${{ github.event.inputs.memory_gb || '24' }}
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Configure OCI credentials
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          oci iam region list > /dev/null

      - name: Skip if instance already exists
        id: check
        env:
          COMP: ${{ secrets.OCI_COMP }}
        run: |
          set -e
          EXISTS=$(oci compute instance list \
            --compartment-id "$COMP" \
            --query "data[?\"display-name\"=='$DISPLAY_NAME' && \"lifecycle-state\"!='TERMINATED'] | length(@)" \
            --raw-output)
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          if [ "$EXISTS" != "0" ]; then
            echo "::notice::Instance '$DISPLAY_NAME' already exists, skipping launch"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write SSH public key
        if: steps.check.outputs.skip != 'true'
        env:
          PUB: ${{ secrets.SSH_PUB_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PUB" > ~/.ssh/oci.pub

      - name: Attempt to launch A1.Flex
        if: steps.check.outputs.skip != 'true'
        id: launch
        env:
          AD: ${{ secrets.OCI_AD }}
          COMP: ${{ secrets.OCI_COMP }}
          IMAGE: ${{ secrets.OCI_IMAGE }}
          SUBNET: ${{ secrets.OCI_SUBNET }}
        run: |
          set +e
          OUT=$(oci compute instance launch \
            --availability-domain "$AD" \
            --compartment-id "$COMP" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config "{\"ocpus\":$OCPUS,\"memoryInGBs\":$MEM_GB}" \
            --image-id "$IMAGE" \
            --subnet-id "$SUBNET" \
            --assign-public-ip true \
            --ssh-authorized-keys-file ~/.ssh/oci.pub \
            --display-name "$DISPLAY_NAME" \
            --boot-volume-size-in-gbs 50 2>&1)
          RC=$?
          echo "$OUT" | tail -40

          if [ $RC -eq 0 ]; then
            INSTANCE_ID=$(echo "$OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])" 2>/dev/null || true)
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG=$(echo "$OUT" | grep -oE '"message": "[^"]+"' | head -1)
          echo "::warning::launch failed: $MSG"
          echo "fail_msg=$MSG" >> "$GITHUB_OUTPUT"

          if echo "$OUT" | grep -qiE 'LimitExceeded|QuotaExceeded|NotAuthorized|InvalidParameter|NotAuthenticated'; then
            echo "::error::Fatal (non-capacity) error - stopping retries"
            echo "fatal=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Wait for RUNNING + grab public IP
        if: steps.launch.outputs.success == 'true'
        id: ip
        env:
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
        run: |
          oci compute instance get --instance-id "$INSTANCE_ID" \
            --wait-for-state RUNNING --max-wait-seconds 300 > /dev/null
          IP=$(oci compute instance list-vnics --instance-id "$INSTANCE_ID" \
            --query 'data[0]."public-ip"' --raw-output)
          echo "public_ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Summary on success
        if: steps.launch.outputs.success == 'true'
        env:
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
          PUBLIC_IP: ${{ steps.ip.outputs.public_ip }}
        run: |
          {
            echo "# A1.Flex provisioned"
            echo ""
            echo "- Instance OCID: \`$INSTANCE_ID\`"
            echo "- Public IP: \`$PUBLIC_IP\`"
            echo "- SSH: \`ssh ubuntu@$PUBLIC_IP\` (use the private key matching SSH_PUB_KEY)"
            echo ""
            echo "Schedule has been disabled. Re-enable in Actions tab if needed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disable workflow (success or fatal error)
        if: steps.launch.outputs.success == 'true' || steps.launch.outputs.fatal == 'true' || steps.check.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/oci-retry.yml/disable"
          echo "::notice::workflow disabled"
